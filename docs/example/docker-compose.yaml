name: contracts-production
services:
  # Frontend application
  frontend:
    image: ghcr.io/la3mmchen/contracts-app:latest
    environment:
      API_URL: "https://contracts.yourdomain.com/api"
      APP_NAME: "contracts"
      CONTRACTS_CATEGORIES: "subscription,insurance,utilities,rent,services,software,maintenance,other"
    restart: unless-stopped
    networks:
      - contracts-network

  # Backend API
  backend:
    image: ghcr.io/la3mmchen/contracts-api:latest
    environment:
      PORT: 3001
      CONTRACTS_DATA_DIR: "/data"
      # Optional: enable the app's built-in single shared-password auth as an
      # alternative to the nginx basic auth below. When set, the frontend shows
      # a login screen. Since this example serves frontend and API behind one
      # nginx (same site), the SameSite=Lax session cookie works correctly.
      # APP_PASSWORD: "change-me"
      # SESSION_SECRET: "a-long-random-string"
      # NODE_ENV: "production"   # served over HTTPS -> Secure cookies
      # APP_ORIGIN: "https://contracts.yourdomain.com"
      # Token for automation (backup cron, CI); sent as
      # "Authorization: Bearer <token>" or "X-API-Key: <token>".
      # API_TOKEN: "another-long-random-string"
    volumes:
      - "/data/contracts:/data"
    restart: unless-stopped
    networks:
      - contracts-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
      - ./logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - contracts-network

networks:
  contracts-network:
    driver: bridge
