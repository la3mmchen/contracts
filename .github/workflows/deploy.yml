name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
          
      - name: Install dependencies with native dependency handling
        run: |
          cd client
          # Remove problematic files
          rm -rf node_modules package-lock.json
          # Clear npm cache
          npm cache clean --force
          # Install with specific flags to handle native dependencies
          npm install --no-optional --ignore-scripts
          # Force reinstall of problematic packages
          npm rebuild
          
      - name: Fix Rollup native dependencies
        run: |
          cd client
          # Ensure we have the right Rollup version for the platform
          npm install rollup@latest --save-dev
          # Remove problematic native dependencies
          npm uninstall @rollup/rollup-linux-x64-gnu @rollup/rollup-darwin-x64 @rollup/rollup-win32-x64 || true
          # Reinstall Rollup without native dependencies
          npm install rollup@latest --save-dev --force
          
      - name: Verify dependencies
        run: |
          cd client
          npm ls rollup
          npm ls @rollup/rollup-linux-x64-gnu || echo "Rollup native dependency not found (expected)"
          
      - name: Build
        run: |
          cd client
          GITHUB_PAGES=true npm run build
        env:
          VITE_FORCE_ESBUILD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
