services:
  # Backend API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CONTRACTS_DATA_DIR=/app/data
      # Internal Paperless base URL used server-side to fetch documents.
      - PAPERLESS_URL=${PAPERLESS_URL:-}
      # Public/external Paperless base URL used only for user-facing document
      # links opened in the browser. Falls back to PAPERLESS_URL when unset.
      - PAPERLESS_PUBLIC_URL=${PAPERLESS_PUBLIC_URL:-}
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN:-}
      # Authentication (single shared password). Leave APP_PASSWORD empty to
      # disable app-level auth (e.g. when using reverse-proxy basic-auth).
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Secret used to sign session cookies. Set to a long random string.
      # If unset, it is derived from APP_PASSWORD.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Token for machine clients (backup cron, CI, scripts). Sent as
      # "Authorization: Bearer <token>" or "X-API-Key: <token>". Independent of
      # APP_PASSWORD so it can be rotated separately. Only enforced when
      # APP_PASSWORD is also set.
      - API_TOKEN=${API_TOKEN:-}
      # Comma-separated list of allowed browser origins for CORS with
      # credentials (e.g. https://contracts.example.com). Empty = reflect origin.
      - APP_ORIGIN=${APP_ORIGIN:-}
      # Enables the Secure flag on session cookies (set to "production" when
      # served over HTTPS).
      - NODE_ENV=${NODE_ENV:-}
    volumes:
      - ./data:/app/data
    container_name: contracts-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend App
  app:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      API_URL: http://localhost:3001/api
      APP_NAME: contracts
      CATEGORIES: subscription,insurance,utilities,rent,services,software,maintenance,other
    depends_on:
      - api
    container_name: contracts-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if curl -f http://localhost:80; then exit 0; else exit 1; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
